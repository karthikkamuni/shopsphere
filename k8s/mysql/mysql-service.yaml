# Headless Service (clusterIP: None): the DNS name "mysql" resolves directly to
# the MySQL pod. The three microservices connect to jdbc:mysql://mysql:3306/<db>.
# It is not exposed outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: shopsphere
  labels:
    app: mysql
    app.kubernetes.io/part-of: shopsphere
spec:
  clusterIP: None
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
