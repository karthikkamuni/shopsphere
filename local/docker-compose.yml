# MySQL for running the three services on your own machine.
#
#   export MYSQL_ROOT_PASSWORD='choose-a-root-password'
#   export MYSQL_PASSWORD='choose-an-app-password'
#   docker compose -f local/docker-compose.yml up -d
#
# The variables are required: compose refuses to start if they are not set, so
# no password is ever stored in this file.
services:
  mysql:
    image: mysql:8.4
    container_name: shopsphere-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting}
      MYSQL_USER: shopsphere
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD before starting}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro

volumes:
  mysql-data:
