# ---------------------------------------------------------------------------
# order-service configuration
#
# Every value below is only a DEFAULT for local development. In Kubernetes the
# same settings are overridden with environment variables (Spring "relaxed
# binding"), for example:
#   SERVER_PORT                  -> server.port
#   SPRING_DATASOURCE_URL        -> spring.datasource.url
#   SPRING_DATASOURCE_USERNAME   -> spring.datasource.username
#   SPRING_DATASOURCE_PASSWORD   -> spring.datasource.password
#   SERVICES_USER_URL            -> services.user.url
#   SERVICES_PRODUCT_URL         -> services.product.url
# Credentials are deliberately NOT defined here.
# ---------------------------------------------------------------------------
spring.application.name=order-service
server.port=8083

spring.datasource.url=jdbc:mysql://localhost:3306/orderdb?useSSL=false&allowPublicKeyRetrieval=true

# Where the other services live. Locally they run on localhost; in Kubernetes
# the environment variables point to the ClusterIP Service names instead.
services.user.url=http://localhost:8081
services.product.url=http://localhost:8082

# Fail fast instead of hanging if another service is down.
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=5s

# "update" creates/alters tables automatically - convenient for a learning
# project. Real production systems use a migration tool (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Health endpoints used by Kubernetes probes. Readiness checks only this
# service's own database - NOT the other services - so one outage does not
# cascade into every service being marked "not ready".
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Let in-flight requests finish when Kubernetes stops the pod.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
