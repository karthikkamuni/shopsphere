# Used by unit tests (@ActiveProfiles("test")): in-memory H2 instead of MySQL,
# so the tests need no database, network or credentials. The calls to
# user-service and product-service are replaced by mocks in the tests.
spring.datasource.url=jdbc:h2:mem:orderdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
security.jwt.secret=test-secret-that-is-definitely-longer-than-32-bytes
shopsphere.service-api-key=test-service-token-that-is-longer-than-32bytes
