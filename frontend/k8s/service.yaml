# The ONLY public entry point of ShopSphere.
#
# type LoadBalancer makes AWS create a load balancer with a public address. The three backend
# services stay ClusterIP (private); this page reaches them through nginx inside the pod.
#
# WARNING: anyone on the internet can open the page and create users, products and orders
# (there is no login in this practice project). To limit access to your own IP address, uncomment
# loadBalancerSourceRanges and put your address in it, e.g. "203.0.113.25/32".
#
# The load balancer takes a few minutes to appear and is billed while it exists. It is deleted
# when this Service is deleted (README "Cleanup"). If you do not want a public address, change
# type to ClusterIP and use: kubectl -n shopsphere port-forward svc/frontend 8080:80
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shopsphere
  labels:
    app: frontend
    app.kubernetes.io/part-of: shopsphere
spec:
  type: LoadBalancer
  # loadBalancerSourceRanges:
  #   - "<your-public-ip>/32"
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
