# nginx configuration for the ShopSphere frontend container.
#
# nginx does two jobs:
#   1. serves the built React app (static files from /usr/share/nginx/html)
#   2. forwards /api/... requests to the three backend Services INSIDE the cluster.
#      The backends have no public address; this container is the only way in.
#
# user-service / product-service / order-service are Kubernetes Service names in the same
# namespace. Kubernetes DNS resolves them. nginx looks the names up ONCE, when it starts, so
# deploy the frontend AFTER the three services exist (README section 12).
#
# Runs as an unprivileged user, so it listens on 8080 (not 80); the Kubernetes Service maps 80 -> 8080.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Security headers. Keep add_header ONLY at server level: nginx drops inherited
    # headers in any location that defines its own add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Settings shared by the three proxied locations below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;

    # Kubernetes probes call this; it does not depend on the backends.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # No URI is given in proxy_pass, so the request path is passed on unchanged:
    # /api/users/7 -> http://user-service:8081/api/users/7
    # Only these three prefixes are forwarded: the services' /actuator endpoints stay private.
    location /api/users {
        proxy_pass http://user-service:8081;
    }

    location /api/auth {
        proxy_pass http://user-service:8081;
    }

    location /api/products {
        proxy_pass http://product-service:8082;
    }

    location /api/orders {
        proxy_pass http://order-service:8083;
    }

    location /api/cart {
        proxy_pass http://order-service:8083;
    }

    location /api/admin {
        proxy_pass http://order-service:8083;
    }

    # Any other /api/... path is an error, not the web page.
    location /api/ {
        default_type application/json;
        return 404 '{"error":"Not Found"}';
    }

    # Vite gives built files a content hash in the name, so they can be cached for a year.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # Single-page app: unknown paths get index.html. It must not be cached, or users would
    # keep an old index.html that points to deleted asset files after a new deployment.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
