# ---------------------------------------------------------------------------
# user-service configuration
#
# Every value below is only a DEFAULT for local development. In Kubernetes the
# same settings are overridden with environment variables (Spring "relaxed
# binding"), for example:
#   SERVER_PORT                  -> server.port
#   SPRING_DATASOURCE_URL        -> spring.datasource.url
#   SPRING_DATASOURCE_USERNAME   -> spring.datasource.username
#   SPRING_DATASOURCE_PASSWORD   -> spring.datasource.password
# Credentials are deliberately NOT defined here.
# ---------------------------------------------------------------------------
spring.application.name=user-service
server.port=8081
security.jwt.secret=${JWT_SECRET:local-development-secret-change-before-deploy-123456}
security.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
shopsphere.admin.name=${SHOPSPHERE_ADMIN_NAME:}
shopsphere.admin.email=${SHOPSPHERE_ADMIN_EMAIL:}
shopsphere.admin.password=${SHOPSPHERE_ADMIN_PASSWORD:}
shopsphere.service-api-key=${SERVICE_API_KEY:}

spring.datasource.url=jdbc:mysql://localhost:3306/userdb?useSSL=false&allowPublicKeyRetrieval=true

# "update" creates/alters tables automatically - convenient for a learning
# project. Real production systems use a migration tool (Flyway/Liquibase).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Health endpoints used by Kubernetes probes:
#   /actuator/health/liveness   - is the JVM alive?
#   /actuator/health/readiness  - can it serve traffic (including DB reachable)?
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db

# Let in-flight requests finish when Kubernetes stops the pod.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
